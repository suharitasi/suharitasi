<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harita — Su Haritası</title>
<meta name="description" content="Türkiye'nin su haritası. Havza verisi ve etkileşimli katman yolda.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" as="image" href="/hedef-hero.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root {
    --deniz: #04121F;
    --kopuk: #A8DDE0;
    --akuamarin: #4FC3D0;
    --metin-soluk: #6C8A96;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--deniz);
    font-family: "Manrope", system-ui, sans-serif;
    overflow: hidden;
  }

  /* Hero: HEDEF.png'nin kendisi — filtre/overlay/karartma YOK */
  .hero {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 42%; /* mobil dikey kadrajda Türkiye ortada */
    opacity: 0;
    transition: opacity 1s ease;
  }

  .hero.geldi { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .hero { transition: none; opacity: 1; }
  }

  .serit {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem clamp(1.25rem, 3vw, 2rem);
    pointer-events: none;
  }

  .serit a {
    pointer-events: auto;
    font-family: "Cormorant", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.3rem;
    color: var(--kopuk);
    text-decoration: none;
    text-shadow: 0 1px 8px rgba(4, 18, 31, 0.5);
  }

  .serit a:focus-visible {
    outline: 2px solid var(--akuamarin);
    outline-offset: 4px;
  }

  .atif {
    position: fixed;
    right: 1rem;
    bottom: 0.7rem;
    z-index: 10;
    font-size: 0.62rem;
    letter-spacing: 0.05em;
    color: rgba(220, 233, 237, 0.55);
    text-shadow: 0 1px 6px rgba(4, 18, 31, 0.5);
    pointer-events: none;
  }
</style>
</head>
<body>

  <img class="hero" src="/hedef-hero.webp" alt="Türkiye'nin kabartma su haritası — sıcak gün ışığında, denizden yükselen su kavisleri ve süzülen damlalarla" fetchpriority="high" decoding="async">

  <header class="serit">
    <a href="/">su haritası</a>
    <span></span>
  </header>

  <p class="atif">suharitasi.com · konsept görsel</p>

  <script>
    const hero = document.querySelector('.hero');
    function goster() { hero.classList.add('geldi'); }
    if (hero.complete) goster();
    else hero.addEventListener('load', goster);
    setTimeout(goster, 2500); // emniyet
  </script>
</body>
</html>
