<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harita — Su Haritası</title>
<meta name="description" content="Türkiye'nin interaktif su haritası. Şimdilik il sınırları; havza verisi yolda.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root {
    --deniz: #04121F;
    --deniz-ust: #061A2E;
    --yukselti: #071D2E;
    --akis-sonuk: #0E3247;
    --akuamarin: #4FC3D0;
    --kopuk: #A8DDE0;
    --metin: #DCE9ED;
    --metin-soluk: #6C8A96;
    /* Atlas dili */
    --atlas-krem: #F3EEE2;
    --atlas-kahve: #4A3628;
    --atlas-kahve-soluk: #6E5238;
    --atlas-hardal: #C7B27B;
    --atlas-kehribar: #D9A05B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: linear-gradient(180deg, var(--deniz-ust) 0%, var(--deniz) 100%);
    color: var(--metin);
    font-family: "Manrope", system-ui, sans-serif;
    overflow: hidden;
  }

  /* Su atmosferi (kabarcık / yoğuşma) */
  .atmosfer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .kabarcik {
    position: absolute;
    bottom: -12px;
    border-radius: 50%;
    background: var(--akuamarin);
    filter: blur(1px);
    animation-name: yuksel;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes yuksel {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(8px, -55vh); }
    100% { transform: translate(-5px, -108vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    .kabarcik { animation: none; opacity: 0 !important; }
  }

  /* Başlık şeridi */
  .serit {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem clamp(1.25rem, 3vw, 2rem);
    pointer-events: none;
  }

  .serit a {
    pointer-events: auto;
    font-family: "Cormorant", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.3rem;
    color: var(--kopuk);
    text-decoration: none;
  }

  .serit a:focus-visible {
    outline: 2px solid var(--akuamarin);
    outline-offset: 4px;
  }

  /* Harita adası: koyu suyun üstünde yüzen aydınlık atlas */
  .cerceve {
    position: fixed;
    top: 3.9rem;
    left: clamp(0.8rem, 2.5vw, 2.2rem);
    right: clamp(0.8rem, 2.5vw, 2.2rem);
    bottom: clamp(0.8rem, 3vh, 1.8rem);
    z-index: 2;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(220, 233, 237, 0.07);
    box-shadow:
      0 30px 80px rgba(1, 6, 11, 0.65),
      0 6px 22px rgba(1, 6, 11, 0.5);
  }

  #harita {
    position: absolute;
    inset: 0;
    background: #A9C3B4;
  }

  /* Bilgi kartı: atlas lejantı */
  .kart {
    position: absolute;
    left: clamp(0.9rem, 2vw, 1.6rem);
    bottom: clamp(0.9rem, 2.5vh, 1.6rem);
    z-index: 5;
    min-width: 12.5rem;
    padding: 1rem 1.3rem 1.1rem;
    background: var(--atlas-krem);
    border: 1px solid var(--atlas-hardal);
    border-left: 3px solid var(--atlas-kehribar);
    box-shadow: 0 10px 30px rgba(46, 33, 20, 0.25);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
  }

  .kart.acik {
    opacity: 1;
    transform: translateY(0);
  }

  .kart h2 {
    font-family: "Cormorant", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.65rem;
    line-height: 1.15;
    color: var(--atlas-kahve);
  }

  .kart p {
    margin-top: 0.3rem;
    font-size: 0.74rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--atlas-kahve-soluk);
  }

  /* Yükleme durumu */
  .yukleniyor {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--deniz-ust) 0%, var(--deniz) 100%);
    opacity: 1;
    transition: opacity 0.8s ease;
  }

  .yukleniyor.bitti {
    opacity: 0;
    pointer-events: none;
  }

  .yukleniyor p {
    font-size: 0.82rem;
    letter-spacing: 0.22em;
    text-transform: lowercase;
    color: var(--metin-soluk);
    animation: nefes 2.4s ease-in-out infinite;
  }

  @keyframes nefes {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .yukleniyor p { animation: none; }
  }

  /* MapLibre varsayılanlarını bastır */
  .maplibregl-canvas:focus { outline: none; }

  .maplibregl-ctrl-attrib {
    background: rgba(243, 238, 226, 0.85) !important;
    color: var(--atlas-kahve-soluk);
    font-family: "Manrope", system-ui, sans-serif;
    font-size: 0.62rem;
  }

  .maplibregl-ctrl-attrib a { color: var(--atlas-kahve-soluk); }
</style>
</head>
<body>

  <header class="serit">
    <a href="/">su haritası</a>
    <span></span>
  </header>

  <div class="cerceve">
    <div id="harita" aria-label="Türkiye haritası"></div>

    <aside class="kart" id="kart" aria-live="polite">
      <h2 id="kart-ad"></h2>
      <p>veri yakında</p>
    </aside>
  </div>

  <div class="yukleniyor" id="yukleniyor" aria-hidden="true">
    <p>harita derinleşiyor…</p>
  </div>

  <script type="module" src="/harita/main.js"></script>
</body>
</html>
