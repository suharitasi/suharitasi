<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harita — Su Haritası</title>
<meta name="description" content="Türkiye'nin interaktif su haritası. Şimdilik il sınırları; havza verisi yolda.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root {
    --deniz: #04121F;
    --deniz-ust: #061A2E;
    --yukselti: #071D2E;
    --akis-sonuk: #0E3247;
    --akuamarin: #4FC3D0;
    --kopuk: #A8DDE0;
    --metin: #DCE9ED;
    --metin-soluk: #6C8A96;
    /* Atlas dili */
    --atlas-krem: #F3EEE2;
    --atlas-kahve: #4A3628;
    --atlas-kahve-soluk: #6E5238;
    --atlas-hardal: #C7B27B;
    --atlas-kehribar: #D9A05B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: linear-gradient(180deg, var(--deniz-ust) 0%, var(--deniz) 100%);
    color: var(--metin);
    font-family: "Manrope", system-ui, sans-serif;
    overflow: hidden;
  }

  /* Su atmosferi (kabarcık / yoğuşma) */
  .atmosfer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .kabarcik {
    position: absolute;
    bottom: -12px;
    border-radius: 50%;
    background: var(--akuamarin);
    filter: blur(1px);
    animation-name: yuksel;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes yuksel {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(8px, -55vh); }
    100% { transform: translate(-5px, -108vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    .kabarcik { animation: none; opacity: 0 !important; }
  }

  /* Başlık şeridi */
  .serit {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem clamp(1.25rem, 3vw, 2rem);
    pointer-events: none;
  }

  .serit a {
    pointer-events: auto;
    font-family: "Cormorant", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.3rem;
    color: var(--kopuk);
    text-decoration: none;
  }

  .serit a:focus-visible {
    outline: 2px solid var(--akuamarin);
    outline-offset: 4px;
  }

  /* Harita adası: koyu suyun üstünde yüzen aydınlık atlas */
  .cerceve {
    position: fixed;
    top: 3.9rem;
    left: clamp(0.8rem, 2.5vw, 2.2rem);
    right: clamp(0.8rem, 2.5vw, 2.2rem);
    bottom: clamp(0.8rem, 3vh, 1.8rem);
    z-index: 2;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(220, 233, 237, 0.07);
    box-shadow:
      0 30px 80px rgba(1, 6, 11, 0.65),
      0 6px 22px rgba(1, 6, 11, 0.5);
  }

  #harita {
    position: absolute;
    inset: 0;
    background: transparent;
  }


  /* Veri atfı */
  .atif {
    position: absolute;
    right: 0.8rem;
    bottom: 0.6rem;
    z-index: 5;
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    color: var(--metin-soluk);
    pointer-events: none;
  }

  /* Cam sıçraması (VIZYON madde 1 prototipi) */
  .cam {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    overflow: hidden;
  }

  .damla {
    position: absolute;
    border-radius: 46% 54% 50% 50%;
    background: radial-gradient(circle at 32% 28%,
      rgba(255, 255, 255, 0.75),
      rgba(222, 240, 240, 0.28) 38%,
      rgba(160, 200, 205, 0.12) 70%,
      transparent);
    box-shadow: inset 0 -1px 2px rgba(255, 255, 255, 0.28), 0 1px 3px rgba(2, 10, 18, 0.3);
    backdrop-filter: blur(1.5px) saturate(1.35) brightness(1.07); /* ışık kırılması */
    animation: damla-sic 1.15s ease-out both;
  }

  @keyframes damla-sic {
    0%   { opacity: 0; transform: scale(0.3); }
    12%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 0; transform: scale(0.95) translateY(6px); }
  }

  .damla--suzulen {
    animation: damla-suzul 6s cubic-bezier(0.45, 0.02, 0.35, 1) both;
  }

  @keyframes damla-suzul {
    0%   { opacity: 0; transform: translateY(0) scaleY(1); }
    8%   { opacity: 0.95; }
    55%  { opacity: 0.8; transform: translateY(46px) scaleY(1.3); }
    100% { opacity: 0; transform: translateY(120px) scaleY(1.15); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cam { display: none; }
  }

  /* Yükleme durumu */
  .yukleniyor {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--deniz-ust) 0%, var(--deniz) 100%);
    opacity: 1;
    transition: opacity 0.8s ease;
  }

  .yukleniyor.bitti {
    opacity: 0;
    pointer-events: none;
  }

  .yukleniyor p {
    font-size: 0.82rem;
    letter-spacing: 0.22em;
    text-transform: lowercase;
    color: var(--metin-soluk);
    animation: nefes 2.4s ease-in-out infinite;
  }

  @keyframes nefes {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .yukleniyor p { animation: none; }
  }

  #harita canvas {
    display: block;
    outline: none;
    touch-action: none;
  }

  /* WebGL yedeği: statik atlas */
  .yedek {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1.5rem;
  }

  .yedek.acik { display: flex; }

  .yedek img {
    max-width: 100%;
    max-height: 82%;
    object-fit: contain;
    border: 1px solid rgba(220, 233, 237, 0.1);
  }

  .yedek p {
    font-size: 0.78rem;
    color: var(--metin-soluk);
    text-align: center;
  }
</style>
</head>
<body>

  <header class="serit">
    <a href="/">su haritası</a>
    <span></span>
  </header>

  <div class="cerceve">
    <div id="harita" aria-label="Türkiye'nin üç boyutlu arazi haritası"></div>

    <p class="atif">Arazi: Mapzen Terrain Tiles (AWS) — SRTM/NASA vd.</p>

    <div class="yedek" id="yedek">
      <img src="../src/assets/tr-atlas.webp" alt="Türkiye hipsometrik atlas haritası">
      <p>Tarayıcınızda WebGL kullanılamadığı için haritanın düz görünümü gösteriliyor.</p>
    </div>
  </div>

  <div class="yukleniyor" id="yukleniyor" aria-hidden="true">
    <p>harita derinleşiyor…</p>
  </div>

  <script type="module" src="/harita/main.js"></script>
</body>
</html>
