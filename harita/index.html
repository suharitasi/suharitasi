<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harita — Su Haritası</title>
<meta name="description" content="Türkiye'nin su haritası. Havza verisi ve etkileşimli katman yolda.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" as="image" href="/hedef-hero.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root {
    --deniz: #04121F;
    --kopuk: #A8DDE0;
    --akuamarin: #4FC3D0;
    --metin-soluk: #6C8A96;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    /* Zemin: görselin adaçayı gri-yeşil kenar tonları */
    background: linear-gradient(180deg, #99A091 0%, #86948A 55%, #6F8279 100%);
    font-family: "Manrope", system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100dvh;
  }

  /* Çerçeveli tablo: görsel ~%88-90, ortalanmış, yumuşak gölge.
     Görselin kendisine filtre/overlay YOK. */
  .cerceve {
    position: relative;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .cerceve.geldi { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .cerceve { transition: none; opacity: 1; }
  }

  .hero {
    display: block;
    max-width: 89vw;
    max-height: 88dvh;
    width: auto;
    height: auto;
    border-radius: 3px;
    box-shadow:
      0 26px 64px rgba(22, 32, 27, 0.38),
      0 6px 18px rgba(22, 32, 27, 0.28);
  }

  .logo {
    position: absolute;
    top: clamp(0.7rem, 2.2vw, 1.3rem);
    left: clamp(0.9rem, 2.6vw, 1.6rem);
    font-family: "Cormorant", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.05rem, 2vw, 1.3rem);
    color: var(--kopuk);
    text-decoration: none;
    text-shadow: 0 1px 8px rgba(4, 18, 31, 0.55);
  }

  .logo:focus-visible {
    outline: 2px solid var(--akuamarin);
    outline-offset: 4px;
  }

  .atif {
    position: absolute;
    right: clamp(0.8rem, 2.2vw, 1.3rem);
    bottom: clamp(0.6rem, 1.8vw, 1rem);
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    color: rgba(220, 233, 237, 0.45);
    text-shadow: 0 1px 6px rgba(4, 18, 31, 0.45);
    pointer-events: none;
  }
</style>
</head>
<body>

  <figure class="cerceve">
    <img class="hero" src="/hedef-hero.webp" alt="Türkiye'nin kabartma su haritası — sıcak gün ışığında, denizden yükselen su kavisleri ve süzülen damlalarla" fetchpriority="high" decoding="async">
    <a class="logo" href="/">su haritası</a>
    <p class="atif">suharitasi.com · konsept görsel</p>
  </figure>

  <script>
    const cerceve = document.querySelector('.cerceve');
    const hero = document.querySelector('.hero');
    function goster() { cerceve.classList.add('geldi'); }
    if (hero.complete) goster();
    else hero.addEventListener('load', goster);
    setTimeout(goster, 2500); // emniyet
  </script>
</body>
</html>
