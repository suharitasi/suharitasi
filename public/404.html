<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa bulunamadı — Su Haritası</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* PALET SU-DİLİ İLE HİZALANDI (M11, 29.07.2026). Bu sayfa ilk koyu
     landing döneminden kalmıştı ve tokenleri sonradan değişen palete
     göre KAYMIŞTI (ölçüldü: --deniz #04121F ≠ güncel #0A2740,
     --akuamarin #4FC3D0 ≠ #57BAE0, --kopuk #A8DDE0 ≠ #DBEAF4).
     Değerler DESIGN.md §2 skalasından; yeni renk icat edilmedi.
     NOT: bu dosya `public/` altında STATİKTİR (Astro düzenine girmez),
     bu yüzden tokenleri elle taşınır — kayma buradan doğdu. */
  :root {
    --deniz: #0A2740;           /* DİP */
    --yukselti: #071D2E;
    --akis-sonuk: #0E3247;
    --akuamarin: #57BAE0;       /* koyu dünyada ışıma */
    --kopuk: #DBEAF4;
    --metin: #DCE9ED;
    --metin-soluk: #92A9B6;     /* eski #6C8A96 → deniz üstünde 4,3:1'di */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--deniz);
    color: var(--metin);
    font-family: "Manrope", system-ui, sans-serif;
    overflow: hidden;
    background-image:
      radial-gradient(120vw 70vh at 50% -18vh, var(--yukselti) 0%, rgba(7, 29, 46, 0) 62%),
      linear-gradient(180deg, var(--deniz) 0%, #030D17 100%);
  }

  .dalgalar {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .dalgalar svg { width: 100%; height: 100%; display: block; }

  .dalgalar path {
    fill: none;
    stroke: var(--akis-sonuk);
    stroke-width: 1.1;
    vector-effect: non-scaling-stroke;
  }

  main {
    position: relative;
    z-index: 2;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-family: "Cormorant", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 6.4vw, 4.6rem);
    line-height: 1.15;
    color: var(--kopuk);
    max-width: 18ch;
    text-wrap: balance;
  }

  p {
    margin-top: 1.2rem;
    font-size: 1rem;
    line-height: 1.6;
    color: var(--metin-soluk);
  }

  a {
    margin-top: 2.4rem;
    /* inline-flex + align-items: min-height 44px verilince inline-block'ta
       alt çizgi metinden KOPUYORDU (kare kanıtı, 29.07). */
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--akuamarin);
    text-decoration: none;
    font-size: 0.86rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid rgba(79, 195, 208, 0.35);
    transition: border-color 0.25s ease, color 0.25s ease;
  }

  a:hover, a:focus-visible {
    color: var(--kopuk);
    border-color: var(--kopuk);
  }

  a:focus-visible {
    outline: 2px solid var(--akuamarin);
    outline-offset: 4px;
  }

  /* İKİNCİL ÇIKIŞLAR (M11): 404'e düşen ziyaretçinin tek kapısı vardı.
     Aynı bağlantı dili, küçük ölçek; yeni desen icat edilmedi. */
  .cikislar {
    margin-top: 2.2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.6rem;
    justify-content: center;
    max-width: 34rem;
  }
  .cikislar a {
    margin-top: 0;
    font-size: 0.74rem;
    letter-spacing: 0.16em;
    color: var(--metin-soluk);
    border-bottom-color: rgba(146, 169, 182, 0.3);
    /* DOKUNMA HEDEFİ 44px (ölçüldü: ilk sürüm 24px'ti). Metin boyutu
       DEĞİŞMEZ; yalnız tıklama alanı büyür — inline-flex + min-height. */
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding-bottom: 0;
  }
  .cikislar a:hover, .cikislar a:focus-visible { color: var(--kopuk); border-color: var(--kopuk); }

  /* overflow:hidden gövdede; dar ekranda ikincil satır sığmazsa
     kaydırılabilsin diye main kendi taşmasını yönetir. */
  main { overflow-y: auto; }
</style>
</head>
<body>

  <div class="dalgalar" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <path d="M -60 148 C 260 160, 520 134, 800 150 S 1260 162, 1500 146"/>
      <path d="M -60 310 C 270 324, 540 296, 820 312 S 1270 326, 1500 308"/>
      <path d="M -60 542 C 280 558, 560 526, 840 544 S 1280 560, 1500 540"/>
      <path d="M -60 858 C 290 876, 570 842, 850 862 S 1280 878, 1500 856"/>
    </svg>
  </div>

  <main>
    <h1>Bu derinlikte bir şey yok.</h1>
    <p>Aradığınız sayfa bulunamadı.</p>
    <a href="/">Ana sayfaya dön</a>

    <nav class="cikislar" aria-label="Başlıca bölümler">
      <a href="/nerede-su-cikar/">Nerede su çıkar</a>
      <a href="/rehberler/">Rehberler</a>
      <a href="/hangi-kurum/">Hangi kurum</a>
      <a href="/harita/">Harita</a>
      <a href="/arsiv/">Veri arşivi</a>
    </nav>
  </main>

</body>
</html>
